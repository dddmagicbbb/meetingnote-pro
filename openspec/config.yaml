# OpenSpec 규칙 - 5-13 에서 쓰는 파일
#
#   openspec init 이 만든 config.yaml 의 rules 아래에 넣을 네 줄
#   지시문에 적으면 2회차에 다시 입력 필요. 한 번 빠뜨린 회차는
#   spec.md 에 근거가 없어 archive 뒤 추적 불가
#
#   둘 곳:  <프로젝트>/openspec/config.yaml
#   주의:   키는 specs. spec 으로 적으면 아래 경고만 뜨고 규칙 미적용
#             Unknown artifact ID in rules: "spec".
#             Known artifact IDs: design, proposal, specs, tasks

schema: spec-driven

rules:
  specs:
    - 각 Requirement 본문 첫 줄에 근거 스토리보드 ID 와 그 상태의 퍼블리싱 파일을 주석으로 남길 것. 상태가 없으면 정의서 절, 2회차에 바뀌면 change 이름도 적을 것
    - 설계문서에 근거가 없으면(지시로 생긴 요구사항) 근거 자리에 change 이름과 (지시) 를 적을 것
    - 새 capability 의 Purpose 절은 50자 이상으로 쓸 것
  tasks:
    - 테스트는 백엔드 구현 그룹 바로 뒤에 「백엔드 테스트」 그룹 하나로 둘 것. 사람 수락 항목은 맨 아래